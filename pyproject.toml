[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orvue-us-inverse"
dynamic = ["version"]
description = "Orvue Surgical Ultrasound Inverse Anatomy Mapping: 3D segmented anatomy from tracked 2D ultrasound frames"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Orvue Surgical A/S" }]
dependencies = [
    "numpy>=2.0",
    "orvue-us-sim>=1.0",    # Ultrasound Imaging Simulator, installed editable from ../Ultrasound_Simulator
    "reportlab>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
orvue-us-inverse = "orvue_us_inverse.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "orvue_us_inverse.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orvue_us_inverse = ["assets/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
