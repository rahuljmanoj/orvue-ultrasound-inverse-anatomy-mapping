[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orvue-us-inverse"
dynamic = ["version"]
description = "Orvue Surgical Ultrasound Inverse Anatomy Mapping: 3D segmented anatomy from tracked 2D ultrasound frames"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Orvue Surgical A/S" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-contrib-python>=4.10",
    "matplotlib>=3.8",
    "scikit-image>=0.24",
    "reportlab>=4.0",
]

[project.optional-dependencies]
camera = ["pyrealsense2>=2.55"]
view3d = ["pyvista>=0.44"]               # optional live 3D window (mapping/live3d.py)
test = ["pytest>=8"]

[project.scripts]
orvue-us-inverse = "orvue_us_inverse.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "orvue_us_inverse.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orvue_us_inverse = ["assets/*.jpg", "viewer3d/template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
